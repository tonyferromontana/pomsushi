name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Textos legales al día
        run: npm run legal && git diff --exit-code src/legal/generated.ts docs/
      - run: npx tsc --noEmit
      - run: npx expo lint

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones y pruebas de seguridad
        run: sudo bash supabase/tests/run.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pruebas y tipos de Edge Functions
        working-directory: supabase/functions
        run: deno test --allow-env _shared/ && deno check */index.ts
