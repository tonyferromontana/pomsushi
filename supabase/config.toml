# Configuración de Supabase CLI para RUÉ (solo lo necesario para las Edge Functions).
# El resto de la configuración del proyecto se maneja en el panel de Supabase.
project_id = "rue"

[functions.webpay-create]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Transbank devuelve a la persona aquí (sin JWT). La seguridad es que el servidor
# confirma el token directamente con Transbank (commit) y valida monto y orden.
[functions.webpay-return]
verify_jwt = false

# La llama la base de datos con un secreto interno (x-rue-secret).
[functions.push-dispatch]
verify_jwt = false
